apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: civicpulse
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: civicpulse-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: civicpulse-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: DATABASE_URL