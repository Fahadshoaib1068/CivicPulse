apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: civicpulse
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: civicpulse-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until python -c "import os, socket, psycopg2; host='postgres'; socket.gethostbyname(host); psycopg2.connect(os.environ['DATABASE_URL']).close()";
              do echo 'waiting for postgres service and database'; sleep 2; done
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: civicpulse-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
      containers:
        - name: migrate
          image: civicpulse-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - head
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: civicpulse-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
