[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civicpulse-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "fastapi==0.141.1",
    "sqlalchemy==2.1.1",
    "uvicorn==0.54.0",
    "psycopg2-binary==2.9.13",
    "redis==8.1.0",
    "alembic==1.20.0",
    "groq==1.7.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]